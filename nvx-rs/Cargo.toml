[package]
name = "nvx-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "NVX mechanics: the OpenVMM control protocol and the launch, policy lowering, and supervision of NVX microVMs"
license = "MIT"
repository = "https://github.com/microsoft/nvx"
readme = "README.md"
keywords = ["sandbox", "microvm", "openvmm", "virtualization"]
categories = ["virtualization"]
publish = false

[lib]
name = "nvx"

[features]
# The serde form of `Hypervisor`.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.200", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0.120"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
