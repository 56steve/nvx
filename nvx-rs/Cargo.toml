[package]
name = "nvx-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "NVX mechanics: the OpenVMM control protocol and the launch, policy lowering, and supervision of NVX microVMs"
license = "MIT"
repository = "https://github.com/microsoft/nvx"
readme = "README.md"
keywords = ["sandbox", "microvm", "openvmm", "virtualization"]
categories = ["virtualization"]
publish = false

[lib]
name = "nvx"

[features]
default = ["host"]
# The host side: control sessions, and process and platform primitives.
host = ["dep:getrandom", "dep:libc", "dep:windows-sys"]
# The serde form of `Hypervisor`.
serde = ["dep:serde"]

[dependencies]
getrandom = { version = "0.4", optional = true }
serde = { version = "1.0.200", features = ["derive"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.160", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json = "1.0.120"
tempfile = "3.10"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
